.glA{animation:gA 2.6s infinite steps(1)} .glB{animation:gB 2.1s infinite steps(1)}
@keyframes gA{0%,100%{transform:translate(-2px,0)}10%{transform:translate(-8px,2px)}12%{transform:translate(3px,-1px)}14%{transform:translate(-2px,0)}60%{transform:translate(-6px,0)}62%{transform:translate(-2px,0)}}
