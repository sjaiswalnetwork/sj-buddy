.grid{animation:gr 1s linear infinite} @keyframes gr{to{transform:translateY(10px)}}
.hue{animation:hu 6s infinite steps(1)} @keyframes hu{0%,95%,100%{filter:none}96%{filter:hue-rotate(150deg) saturate(2)}97.5%{filter:invert(1) hue-rotate(180deg)}}</style>
